# Served behind Caddy on the host: Caddy terminates TLS and proxies plain HTTP here.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative redirects, so a "/dir" -> "/dir/" redirect keeps Caddy's https host instead of http://localhost
    absolute_redirect off;

    # Security headers. HSTS belongs on Caddy (the TLS layer); don't repeat these there.
    # Only set here, never with add_header inside a location, or nginx drops all of them for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;

    # Clean URLs: /page serves page.html; anything else that doesn't exist is a real 404 (no SPA fallback)
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Asset filenames aren't content-hashed, so keep caches short enough that a deploy shows up within a day
    location ~* \.(?:css|js)$ {
        expires 1d;
    }

    location ~* \.(?:woff2|webp|png|ico|jpg|svg)$ {
        expires 30d;
    }

    location ~* \.pdf$ {
        expires 1d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
