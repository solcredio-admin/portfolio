services:
  portfolio:
    image: ghcr.io/solcredio-admin/portfolio:latest
    container_name: portfolio
    restart: unless-stopped

    # Loopback only: the host's Caddy is the single public entry point.
    # Host port 3000 -> nginx listens on 80 inside the container.
    ports:
      - "127.0.0.1:3000:80"

    # Hardening. nginx only needs to write its pid, cache and temp files.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
